<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smash Town</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Noto+Sans+KR:wght@500;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="photo-hint" hidden></div>
    <div id="hud" hidden>
      <button id="btn-pause" class="hud-btn" aria-label="Pause">☰</button>
      <button id="btn-map" class="hud-btn" aria-label="Map">&#128506;</button>

      <div id="status">
        <div id="stars" title="WANTED">
          <span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span>
        </div>
        <div id="cash">$0</div>
        <div id="ammo" hidden></div>
        <div id="stars-count" title="Golden stars">★ 0/12</div>
        <div id="phealth"><span data-i18n="ui.hp">HP</span><div class="track"><div id="phealth-fill" class="fill hp"></div><div id="parmor-fill"></div></div></div>
        <div id="combo"><span data-i18n="ui.smash_combo">SMASH COMBO</span> <b id="combo-mult"></b><div id="combo-bar"><div id="combo-fill"></div></div></div>
      </div>

      <div id="top-center">
        <div id="story-pill" hidden><div id="story-title"></div><div id="story-text"></div><div id="story-nav" hidden><span id="nav-arrow">&#9650;</span><span id="nav-dist"></span></div></div>
        <div id="gig" hidden><div id="gig-title"></div><div id="gig-obj"></div><div id="gig-time"></div></div>
      </div>
      <div id="dialog" hidden><div id="dlg-who"></div><div id="dlg-text"></div><div id="dlg-hint"></div></div>
      <div id="crosshair" hidden><i class="ch t"></i><i class="ch b"></i><i class="ch l"></i><i class="ch r"></i><i class="ch dot"></i><i class="ch ring"></i><i class="ch arrow"></i></div>
      <div id="lockon" hidden><i></i><i></i><i></i><i></i></div>
      <div id="toast"></div>
      <div id="news"></div>
      <div id="prompt" hidden></div>
      <div id="overlay-msg" hidden></div>

      <canvas id="minimap" width="280" height="280"></canvas>
      <div id="wanted-banner" hidden data-i18n="ui.wanted">WANTED</div>

      <div id="telemetry">
        <div id="speedo-wrap">
          <canvas id="speedo" width="240" height="240"></canvas>
          <div id="speed-readout"><span id="speed-num">0</span><small data-i18n="ui.kmh">km/h</small></div>
        </div>
        <div class="bars">
          <div class="bar"><label data-i18n="ui.nitro">NITRO</label><div class="track"><div id="nitro-fill" class="fill nitro"></div></div></div>
          <div class="bar"><label data-i18n="ui.hp">HP</label><div class="track"><div id="hp-fill" class="fill hp"></div></div></div>
        </div>
        <div id="pad-hint"><div class="pad-drive" data-i18n="ui.pad.drive"></div><div class="pad-foot" data-i18n="ui.pad.foot"></div></div>
        <ul id="hints" class="hints-drive">
          <li data-i18n="ui.hint.drive"></li>
          <li data-i18n="ui.hint.handbrake"></li>
          <li data-i18n="ui.hint.nitro"></li>
          <li data-i18n="ui.hint.exit_car"></li>
          <li data-i18n="ui.hint.time"></li>
          <li data-i18n="ui.hint.reset"></li>
          <li data-i18n="ui.hint.map"></li>
        </ul>
        <div id="foot-hud">
          <div id="weapon-slots">
            <div class="slot sel"><b>1</b><i>&#9994;</i><span data-i18n="ui.weapon.fist">Fist</span></div>
            <div class="slot"><b>2</b><i>&#9918;</i><span data-i18n="ui.weapon.bat">Bat</span></div>
            <div class="slot locked"><b>3</b><i>&#128738;</i><span data-i18n="ui.weapon.baton">Baton</span></div>
            <div class="slot gun" hidden><b>4</b><i></i><span></span></div>
            <div class="slot gun" hidden><b>5</b><i></i><span></span></div>
            <div class="slot gun" hidden><b>6</b><i></i><span></span></div>
            <div class="slot gun" hidden><b>7</b><i></i><span></span></div>
            <div class="slot gun" hidden><b>8</b><i></i><span></span></div>
            <div class="slot gun" hidden><b>9</b><i></i><span></span></div>
          </div>
          <ul class="hints-foot">
            <li data-i18n="ui.hint.attack"></li>
            <li data-i18n="ui.hint.aim"></li>
            <li data-i18n="ui.hint.kick"></li>
            <li data-i18n="ui.hint.dodge"></li>
            <li data-i18n="ui.hint.jump"></li>
            <li data-i18n="ui.hint.weapon_swap"></li>
            <li data-i18n="ui.hint.enter_car"></li>
          </ul>
        </div>
      </div>
    </div>

    <div id="title" class="overlay">
      <div class="panel title-panel">
        <h1 data-i18n="ui.title">SMASH TOWN</h1>
        <p data-i18n="ui.tagline"></p>
        <button id="btn-play" class="big" data-i18n="ui.play">PLAY</button>
      </div>
    </div>

    <div id="pause" class="overlay" hidden>
      <div class="panel">
        <h2 data-i18n="ui.paused">PAUSED</h2>
        <div class="row"><span data-i18n="ui.story">STORY</span><span id="story-progress"></span></div>
        <div id="earnings"></div>
        <div class="row"><span data-i18n="ui.settings.language">Language</span>
          <div class="segs"><button class="seg lang" data-lang="en">English</button><button class="seg lang" data-lang="ko">한국어</button></div>
        </div>
        <div class="row"><span data-i18n="ui.settings.graphics">Graphics</span>
          <div class="segs">
            <button class="seg quality" data-q="high" data-i18n="ui.quality.high"></button>
            <button class="seg quality" data-q="medium" data-i18n="ui.quality.medium"></button>
            <button class="seg quality" data-q="low" data-i18n="ui.quality.low"></button>
          </div>
        </div>
        <div class="row kids-row"><span><span data-i18n="ui.settings.kids">Kids Play</span><small class="hint" data-i18n="ui.settings.kids_hint"></small></span>
          <div class="segs">
            <button class="seg kids" data-k="1" data-i18n="ui.on"></button>
            <button class="seg kids" data-k="0" data-i18n="ui.off"></button>
          </div>
        </div>
        <div class="row"><span data-i18n="ui.settings.audio">Audio</span>
          <div class="segs">
            <button class="seg audio" data-a="1" data-i18n="ui.on"></button>
            <button class="seg audio" data-a="0" data-i18n="ui.off"></button>
          </div>
        </div>
        <div class="row"><span data-i18n="ui.settings.radio">Radio (N)</span>
          <div class="segs">
            <button class="seg radio" data-r="off" data-i18n="ui.off"></button>
            <button class="seg radio" data-r="0">&#9834; 1</button>
            <button class="seg radio" data-r="1">&#9834; 2</button>
            <button class="seg radio" data-r="2">&#9834; 3</button>
          </div>
        </div>
        <div class="row"><span data-i18n="ui.settings.weather">Weather</span>
          <div class="segs">
            <button class="seg weather" data-w="auto" data-i18n="ui.weather.auto"></button>
            <button class="seg weather" data-w="clear" data-i18n="ui.weather.clear"></button>
            <button class="seg weather" data-w="rain" data-i18n="ui.weather.rain"></button>
            <button class="seg weather" data-w="fog" data-i18n="ui.weather.fog"></button>
            <button class="seg weather" data-w="storm" data-i18n="ui.weather.storm"></button>
            <button class="seg weather" data-w="snow" data-i18n="ui.weather.snow"></button>
          </div>
        </div>
        <div class="row"><span data-i18n="ui.settings.time">Time of day</span>
          <div class="segs">
            <button class="seg tod" data-t="noon" data-i18n="ui.time.noon"></button>
            <button class="seg tod" data-t="sunset" data-i18n="ui.time.sunset"></button>
            <button class="seg tod" data-t="night" data-i18n="ui.time.night"></button>
          </div>
        </div>
        <div class="row"><span data-i18n="ui.settings.sens">Look sensitivity</span>
          <div class="segs"><button class="seg sens" data-v="0.6">0.6x</button><button class="seg sens" data-v="1">1x</button><button class="seg sens" data-v="1.5">1.5x</button><button class="seg sens" data-v="2.2">2.2x</button></div>
        </div>
        <div class="row"><span data-i18n="ui.settings.aimsens">Aim sensitivity</span>
          <div class="segs"><button class="seg aimSens" data-v="0.5">0.5x</button><button class="seg aimSens" data-v="0.85">0.85x</button><button class="seg aimSens" data-v="1">1x</button></div>
        </div>
        <div class="row"><span data-i18n="ui.settings.autoaim">Auto-aim (B)</span>
          <div class="segs"><button class="seg autoaim" data-a="1" data-i18n="ui.on"></button><button class="seg autoaim" data-a="0" data-i18n="ui.off"></button></div>
        </div>
        <div class="row"><span data-i18n="ui.settings.fov">Field of view</span>
          <div class="segs"><button class="seg fov" data-v="-6">-</button><button class="seg fov" data-v="0">0</button><button class="seg fov" data-v="8">+</button><button class="seg fov" data-v="16">++</button></div>
        </div>
        <div class="row"><span data-i18n="ui.settings.shake">Camera shake</span>
          <div class="segs"><button class="seg shake" data-v="0" data-i18n="ui.off"></button><button class="seg shake" data-v="0.5">50%</button><button class="seg shake" data-v="1">100%</button><button class="seg shake" data-v="1.5">150%</button></div>
        </div>
        <div class="row"><span></span>
          <div class="segs"><button id="btn-stats" class="seg" data-i18n="ui.settings.stats">Stats</button><button id="btn-controls" class="seg" data-i18n="ui.settings.controls">Controls</button><button id="btn-howto" class="seg" data-i18n="ui.settings.howto">How to play</button><button id="btn-newgame" class="seg warn" data-i18n="ui.settings.newgame">New game</button></div>
        </div>
        <button id="btn-resume" class="big" data-i18n="ui.resume">RESUME</button>
      </div>
    </div>

    <div id="garage" class="overlay" hidden></div>

    <div id="fade"></div>

    <div id="touch" hidden>
      <!-- left zone: steering arrows while driving, analog stick on foot (forward / back / strafe) -->
      <div class="zone-left">
        <div class="steer only-car"><button data-vbtn="left">&#9664;</button><button data-vbtn="right">&#9654;</button></div>
        <div id="stick" class="only-foot"><div id="stick-knob"></div></div>
      </div>
      <!-- right zone: action buttons -->
      <div class="zone-right">
        <div class="gunrow"><button id="btn-aim" data-tap="AimToggle">AIM</button><button id="btn-auto" data-tap="AutoToggle">AUTO</button><button id="btn-reload" data-tap="KeyR">R</button></div>
        <div class="grid3 only-car">
          <button data-vbtn="nitro">N2O</button><button data-vbtn="hand">DRIFT</button><button data-tap="KeyF">F</button>
          <button data-vbtn="down">&#9660;</button><span></span><button data-vbtn="up" class="gas">&#9650;</button>
        </div>
        <div class="grid3 only-foot">
          <button data-tap="KeyK">KICK</button><button data-tap="Space">DODGE</button><button data-tap="KeyC">JUMP</button>
          <button data-tap="KeyV">WPN</button><button data-tap="KeyF">F</button><button data-vbtn="fire" data-tap="KeyJ" class="hit">HIT</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
